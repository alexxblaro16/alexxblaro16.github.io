<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alejandro Blanco Rodríguez · Desarrollador Full Stack</title>
  <meta name="description" content="Portfolio de Alejandro Blanco Rodríguez, desarrollador full stack junior (Java, React, Laravel, Python). Un videojuego en píxeles con mi trayectoria, mis proyectos y mi contacto.">
  <meta property="og:title" content="Alejandro Blanco Rodríguez · Desarrollador Full Stack">
  <meta property="og:description" content="Mi vida en píxeles: trayectoria, proyectos y contacto en forma de videojuego.">
  <meta name="theme-color" content="#1b1f27">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1f27'/%3E%3Ctext x='3' y='12' font-size='10' font-family='monospace' fill='%232fbf71'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="juego"></div>
  <div id="niebla" aria-hidden="true"></div>
  <div id="pantalla" class="pantalla" hidden></div>

  <!-- Barra superior: lo importante siempre a la vista -->
  <header id="hud">
    <div class="hud-izq">
      <b class="marca">alejandro.blanco()</b>
      <span id="hud-titulo"></span>
      <a id="btn-practicas" class="boton verde"></a>
      <a id="btn-cv" class="boton" download></a>
      <button id="btn-mas" class="boton" aria-label="Más opciones" aria-expanded="false">☰</button>
    </div>
    <div class="hud-der">
      <span id="hud-zonas"></span>
      <span id="hud-esferas" hidden></span>
      <button id="btn-hora" class="boton" title="Día o noche" aria-label="Día o noche"><span id="hora-icono"><svg class="icono" viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#f2c200" d="M3 2h3v1h1v3H6v1H3V6H2V3h1zM4 0h1v1H4zM4 8h1v1H4zM0 4h1v1H0zM8 4h1v1H8zM1 1h1v1H1zM7 1h1v1H7zM1 7h1v1H1zM7 7h1v1H7z"/></svg></span><span class="solo-menu" id="txt-hora"></span></button>
      <button id="btn-pantalla" class="boton" title="Pantalla completa" aria-label="Pantalla completa"><svg class="icono" viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h3v1H1v2H0zM6 0h3v3H8V1H6zM0 6h1v2h2v1H0zM8 6h1v3H6V8h2z"/></svg><span class="solo-menu" id="txt-pantalla"></span></button>
      <button id="btn-sonido" class="boton"></button>
      <button id="btn-musica" class="boton" title="Cambiar música"></button>
      <button id="btn-idioma" class="boton"></button>
      <button id="btn-clasico" class="boton"></button>
      <button id="btn-menu" class="boton"></button>
    </div>
  </header>
  <p id="ayuda"></p>

  <!-- Diálogo estilo RPG -->
  <div id="dialogo" hidden><b id="dialogo-nombre"></b><p id="dialogo-texto"></p><span class="seguir">▼</span></div>

  <!-- Panel de cada zona -->
  <div id="panel" hidden>
    <div class="ventana">
      <div class="ventana-barra"><i></i><i></i><i></i><h2 id="panel-titulo"></h2><button id="panel-cerrar" aria-label="Cerrar">✕</button></div>
      <div id="panel-cuerpo"></div>
    </div>
  </div>

  <div id="logros"></div>
  <span id="etiqueta" hidden></span>

  <!-- Mando táctil -->
  <!-- Mando táctil: una palanca que aparece donde pones el dedo (mitad izquierda) y el botón de acción -->
  <div id="mando">
    <div id="palanca" aria-label="Mover"><div class="palanca-base"><div class="palanca-bola"></div></div></div>
    <button id="btn-accion"></button>
  </div>

  <!-- Modo clásico: todo el contenido como web normal -->
  <section id="clasico" hidden>
    <button id="clasico-volver" class="boton verde"></button>
    <div id="clasico-cuerpo"></div>
  </section>

  <noscript><p style="color:#fff;padding:2rem;font-family:sans-serif">Alejandro Blanco Rodríguez · Desarrollador Full Stack Junior · alexxblaro@gmail.com · github.com/alexxblaro16</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
